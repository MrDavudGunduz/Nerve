# Nerve — Continuous Integration
#
# Builds and tests all SPM packages on every PR and push to main.
# Includes Thread Sanitizer (TSan) for data race detection.
#
# Architecture:
#   - SwiftLint: lint check before any builds
#   - Matrix strategy: tests each package independently
#   - iOS Simulator + macOS native destinations
#   - TSan enabled via xcodebuild settings
#   - Code coverage gate: enforces minimum 80% coverage on core packages
#
# Reference: DEVELOPMENT_ROADMAP.md → Cross-Cutting Concerns → CI/CD Pipeline

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.0"

jobs:
  # ── SwiftLint ──────────────────────────────────────────────────────
  lint:
    name: "SwiftLint"
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ── SPM Package Tests ─────────────────────────────────────────────
  spm-tests:
    name: "Test ${{ matrix.package }} (${{ matrix.platform }})"
    runs-on: macos-15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        package:
          - Core
          - NetworkLayer
          - StorageLayer
          - MapFeature
          - ARFeature
          - AILayer
        platform:
          - iOS
          - macOS
        exclude:
          # MapFeature and ARFeature use UIKit — skip macOS for these.
          - package: MapFeature
            platform: macOS
          - package: ARFeature
            platform: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(cat .xcode-version)
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "⚠️ Xcode ${XCODE_VERSION} not found, using default"
            xcode-select -p
          fi

      - name: Resolve Packages
        run: swift package resolve
        working-directory: Packages/${{ matrix.package }}

      - name: Build & Test (iOS)
        if: matrix.platform == 'iOS'
        run: |
          xcodebuild test \
            -scheme ${{ matrix.package }} \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -enableThreadSanitizer YES \
            -enableCodeCoverage YES \
            -resultBundlePath .build/results-${{ matrix.package }}-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || true
        working-directory: Packages/${{ matrix.package }}

      - name: Build & Test (macOS)
        if: matrix.platform == 'macOS'
        run: |
          swift test \
            --package-path Packages/${{ matrix.package }} \
            --sanitize=thread \
            --enable-code-coverage

      - name: Check Code Coverage (iOS)
        if: matrix.platform == 'iOS'
        run: |
          RESULT_PATH="Packages/${{ matrix.package }}/.build/results-${{ matrix.package }}-iOS.xcresult"
          if [ -d "$RESULT_PATH" ]; then
            COVERAGE=$(xcrun xccov view --report --json "$RESULT_PATH" \
              | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          targets = data.get('targets', [])
          for t in targets:
              if '${{ matrix.package }}' in t.get('name', ''):
                  print(f\"{t.get('lineCoverage', 0) * 100:.1f}\")
                  break
          else:
              print('0.0')
          ")
            echo "📊 Coverage for ${{ matrix.package }}: ${COVERAGE}%"

            # Enforce 80% minimum on core packages
            CORE_PACKAGES="Core NetworkLayer StorageLayer AILayer"
            if echo "$CORE_PACKAGES" | grep -qw "${{ matrix.package }}"; then
              THRESHOLD=80.0
              PASS=$(python3 -c "print('yes' if float('${COVERAGE}') >= ${THRESHOLD} else 'no')")
              if [ "$PASS" != "yes" ]; then
                echo "❌ Coverage ${COVERAGE}% is below minimum ${THRESHOLD}%"
                exit 1
              fi
              echo "✅ Coverage gate passed: ${COVERAGE}% >= ${THRESHOLD}%"
            fi
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.package }}-${{ matrix.platform }}
          path: Packages/${{ matrix.package }}/.build/results-*.xcresult
          if-no-files-found: ignore

  # ── App Target Build ──────────────────────────────────────────────
  app-build:
    name: "Build Nerve App (iOS)"
    runs-on: macos-15
    needs: spm-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(cat .xcode-version)
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "⚠️ Xcode ${XCODE_VERSION} not found, using default"
            xcode-select -p
          fi

      - name: Build App
        run: |
          xcodebuild build \
            -scheme Nerve \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -enableThreadSanitizer YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || true

  # ── Status Gate ───────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, spm-tests, app-build]
    if: always()
    steps:
      - name: Check Results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.spm-tests.result }}" != "success" ] || \
             [ "${{ needs.app-build.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All checks passed (lint + tests + build + coverage)"
